<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Clasificador Cultural</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2em;
        }
        .container {
            max-width: 500px;
            margin: auto;
        }
        .preview {
            width: 100%;
            margin-top: 1em;
        }
        .resultado {
            margin-top: 1em;
            padding: 1em;
            background-color: #f2f2f2;
            border-radius: 5px;
        }
        input[type="file"] {
            margin-top: 1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Bienvenido, {{ user.username }}</h2>
        <p>Sube una imagen para clasificar la cultura indígena:</p>

        <form id="formulario" enctype="multipart/form-data">
            <input type="file" name="imagen" id="imagen" accept="image/*" required><br>
            <button type="submit">Clasificar Imagen</button>
        </form>

        <img id="preview" class="preview" src="" style="display:none;" alt="Vista previa">

        <div class="resultado" id="resultado" style="display:none;">
            <p><strong>Cultura:</strong> <span id="cultura"></span></p>
            <p><strong>Confianza:</strong> <span id="confianza"></span></p>
        </div>

        <p><a href="{{ url_for('logout') }}">Cerrar sesión</a></p>
    </div>

    <script>
        const form = document.getElementById('formulario');
        const preview = document.getElementById('preview');
        const resultado = document.getElementById('resultado');
        const cultura = document.getElementById('cultura');
        const confianza = document.getElementById('confianza');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const archivo = document.getElementById('imagen').files[0];
            if (!archivo) return;

            // Vista previa
            preview.src = URL.createObjectURL(archivo);
            preview.style.display = 'block';

            const formData = new FormData();
            formData.append('imagen', archivo);

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.error) {
                    resultado.style.display = 'block';
                    cultura.textContent = "Error";
                    confianza.textContent = data.error;
                } else {
                    resultado.style.display = 'block';
                    cultura.textContent = data.cultura;
                    confianza.textContent = (data.confianza * 100).toFixed(1) + "%";
                }

            } catch (error) {
                resultado.style.display = 'block';
                cultura.textContent = "Error";
                confianza.textContent = error;
            }
        });
    </script>
</body>
</html>
