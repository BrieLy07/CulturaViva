<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <!-- Franja bandera Ecuador -->
    <div class="bandera">
        <div class="franja amarilla"></div>
        <div class="franja azul"></div>
        <div class="franja roja"></div>
    </div>

    <!-- Botón cerrar sesión -->
    <div class="cerrar-sesion-container">
        <form method="GET" action="{{ url_for('logout') }}">
            <button type="submit" class="btn cerrar-sesion-btn">Cerrar Sesión</button>
        </form>
    </div>

    <!-- Contenido central -->
    <div class="dashboard-layout">
        <!-- Columna izquierda -->
        <div class="dashboard-texto">
            <h2 class="titulo-app">¿No sabes el nombre de alguna cultura?</h2>
            <p class="subtitulo">Sube una imagen y nosotros te ayudamos</p>

            <form action="{{ url_for('predict') }}" method="POST" enctype="multipart/form-data">
                <div class="input-group">
                    <label for="imagen">Selecciona una imagen:</label>
                    <input type="file" name="imagen" accept="image/*" required>
                </div>
                <button type="submit" class="btn">Predecir Imagen</button>
            </form>

            {% if cultura %}
                <div class="resultado">
                    <h3>Resultado:</h3>
                    <p><strong>Cultura:</strong> {{ cultura }}</p>
                    {% if confianza %}
                        <p><strong>Confianza:</strong> {{ confianza }}%</p>
                    {% endif %}
                </div>
            {% endif %}
        </div>

        <!-- Columna derecha -->
        {% if confianza %}
        <div class="dashboard-imagen">
            <img src="{{ url_for('static', filename='ultima_imagen.png') }}" alt="Imagen cargada">
        </div>
        {% endif %}
    </div>

</body>
</html>
