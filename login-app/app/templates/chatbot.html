<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chatbot Cultural</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            margin: 0;
            padding: 0;
        }

        .chat-container {
            max-width: 700px;
            margin: 50px auto;
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 25px;
        }

        .chat-box {
            height: 350px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 15px;
            background-color: #fefefe;
            border-radius: 10px;
            scroll-behavior: smooth;
        }

        .input-container {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .input-container input {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        .input-container button {
            padding: 12px 20px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .input-container button:hover {
            background-color: #0f5dd4;
        }

        .mensaje {
            margin: 12px 0;
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            position: relative;
            clear: both;
            line-height: 1.4em;
        }

        .usuario {
            background-color: #d1e7dd;
            align-self: flex-end;
            margin-left: auto;
            border-bottom-right-radius: 0;
        }

        .bot {
            background-color: #f8d7da;
            align-self: flex-start;
            margin-right: auto;
            border-bottom-left-radius: 0;
        }

        .usuario::before {
            content: "🙋‍♂️ ";
            font-weight: bold;
        }

        .bot::before {
            content: "🤖 ";
            font-weight: bold;
        }

        .btn {
            background-color: #0d6efd;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            display: inline-block;
            margin-top: 20px;
        }

        .btn:hover {
            background-color: #0b5ed7;
        }

        .bandera {
            display: flex;
            height: 80px; /* antes era 20px */
        }


        .franja {
            flex: 1;
        }

        .amarilla { background-color: #ffcc00; }
        .azul { background-color: #0033a0; }
        .roja { background-color: #d52b1e; }

        .cerrar-sesion-container {
            text-align: right;
            padding: 10px 20px;
        }

        .cerrar-sesion-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .cerrar-sesion-btn:hover {
            background-color: #c82333;
        }

        .dashboard-btn {
            display: inline-block;
            width: 500px;               /* ✅ Fuerza un ancho fijo */
            padding: 10px;
            background-color: #006aff;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            transition: background-color 0.3s ease;
        }

        .dashboard-btn:hover {
            background-color: #0050cc;
        }

        .img-bottom-left {
            position: absolute;
            bottom: 80px;
            left: 100px;
            width: 450px;        /* ajusta el tamaño según necesites */
            height: auto;
            z-index: 0;
            pointer-events: none;
        }

.img-right-center {
    position: absolute;
    top: 50%;
    right: 200px;
    transform: translateY(-50%);
    width: 400px;        /* ajusta el tamaño según necesites */
    height: auto;
    z-index: 0;
    pointer-events: none;
}





    </style>
</head>
<body>

<!-- Imagen en esquina inferior izquierda -->
<img src="{{ url_for('static', filename='img/culturas/chatbot1.jpg') }}" 
     alt="Decoración 1" 
     class="img-bottom-left">

<!-- Imagen en costado derecho centrada -->
<img src="{{ url_for('static', filename='img/culturas/chatbot2.jpg') }}" 
     alt="Decoración 2" 
     class="img-right-center">


<!-- Franja bandera Ecuador -->
<div class="bandera">
    <div class="franja amarilla"></div>
    <div class="franja azul"></div>
    <div class="franja roja"></div>
</div>

<!-- Botón cerrar sesión -->
<div class="cerrar-sesion-container">
    <form method="GET" action="{{ url_for('logout') }}">
        <button type="submit" class="cerrar-sesion-btn">Cerrar Sesión</button>
    </form>
</div>

<div class="chat-container">
    <h2 style="text-align: center;">🤖 Chatbot Cultural</h2>

    <div class="chat-box" id="chat-box">
        <div class="mensaje bot">Hola, ¿en qué te puedo ayudar sobre esta cultura?</div>
    </div>

    <div class="input-container">
        <input type="text" id="mensaje" placeholder="Escribe tu pregunta...">
        <button onclick="enviarMensaje()">Enviar</button>
    </div>

   <div style="text-align: center; margin-top: 15px;">
        <a href="{{ url_for('dashboard') }}" class="btn dashboard-btn">⬅ Volver al Dashboard</a>
    </div>

</div>

<script>
    async function enviarMensaje() {
        const mensajeUsuario = document.getElementById('mensaje').value.trim();
        if (!mensajeUsuario) return;

        const chatBox = document.getElementById('chat-box');

        const divUsuario = document.createElement('div');
        divUsuario.className = 'mensaje usuario';
        divUsuario.textContent = mensajeUsuario;
        chatBox.appendChild(divUsuario);

        // Mostrar mensaje "pensando..."
        const divBot = document.createElement('div');
        divBot.className = 'mensaje bot';
        divBot.textContent = '⏳ Pensando...';
        chatBox.appendChild(divBot);

        chatBox.scrollTop = chatBox.scrollHeight;
        document.getElementById('mensaje').value = '';

        try {
            const respuesta = await fetch('/ver_prompt', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ mensaje: mensajeUsuario })
            });

            const data = await respuesta.json();
            divBot.textContent = data.respuesta;

        } catch (error) {
            divBot.textContent = '❌ Error al contactar con el modelo.';
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
