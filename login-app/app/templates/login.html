<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cultura Viva</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tu CSS personalizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <!-- Bandera estilo Ecuador -->
    <div class="bandera d-flex flex-column">
        <div class="franja amarilla" style="height: 30px; background-color: #FFD700;"></div>
        <div class="franja azul" style="height: 20px; background-color: #0033A0;"></div>
        <div class="franja roja" style="height: 20px; background-color: #CE1126;"></div>
    </div>

    <!-- Contenido centrado y responsive -->
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="w-100" style="max-width: 400px;">
            <h1 class="text-center">Bienvenidos a <span class="titulo-app">Cultura Viva</span></h1>
            <h3 class="text-center subtitulo">Tu App tradición</h3>

            <p class="text-center texto-secundario mt-3">¿Ya tienes una cuenta?</p>

            <div class="card shadow p-4">
                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" id="username" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
                <p class="text-center mt-3 registro-texto">¿No tienes una cuenta? <a href="{{ url_for('register') }}">Regístrate aquí</a></p>
            </div>
        </div>
    </div>

</body>
</html>
