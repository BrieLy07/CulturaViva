<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>

    <!-- Bootstrap 5 añadido -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tu estilo personalizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <!-- Franja tricolor bandera -->
    <div class="bandera d-flex flex-column">
        <div class="franja amarilla" style="height: 30px; background-color: #FFD700;"></div>
        <div class="franja azul" style="height: 20px; background-color: #0033A0;"></div>
        <div class="franja roja" style="height: 20px; background-color: #CE1126;"></div>
    </div>

    <!-- Encabezado -->
    <div class="container text-center my-4">
        <h2>Regístrate</h2>
        <p>En la mejor App de búsqueda tradicional.</p>
    </div>

    <!-- Contenido principal -->
    <div class="container d-flex flex-column flex-md-row justify-content-center align-items-center gap-4 mb-5">

        <!-- Formulario -->
        <form method="POST" action="/register" class="register-form w-100" style="max-width: 500px;">
            <div class="input-group mb-3">
                <label for="first_name" class="form-label w-100">Nombre
                    <input type="text" id="first_name" name="first_name" class="form-control" required>
                </label>
            </div>
            <div class="input-group mb-3">
                <label for="last_name" class="form-label w-100">Apellido
                    <input type="text" id="last_name" name="last_name" class="form-control" required>
                </label>
            </div>
            <div class="input-group mb-3">
                <label for="email" class="form-label w-100">Correo electrónico
                    <input type="email" id="email" name="email" class="form-control" required>
                </label>
            </div>
            <div class="input-group mb-3">
                <label for="phone" class="form-label w-100">Teléfono
                    <input type="text" id="phone" name="phone" class="form-control" required>
                </label>
            </div>
            <div class="input-group mb-3">
                <label for="username" class="form-label w-100">Usuario
                    <input type="text" id="username" name="username" class="form-control" required>
                </label>
            </div>
            <div class="input-group mb-3">
                <label for="password" class="form-label w-100">Contraseña
                    <input type="password" id="password" name="password" class="form-control" required>
                </label>
            </div>
            <div class="input-group mb-3">
                <label for="confirm_password" class="form-label w-100">Confirmar Contraseña
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
                </label>
            </div>
            <button type="submit" class="btn btn-success w-100">Registrarse</button>
        </form>

        <!-- Imagen lateral -->
        <div class="imagen-registro text-center">
            <img src="{{ url_for('static', filename='bandera.png') }}" alt="Imagen de registro" class="img-fluid" style="max-width: 300px;">
        </div>
    </div>

</body>
</html>
