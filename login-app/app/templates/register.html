<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <!-- Franja tricolor bandera -->
    <div class="bandera">
        <div class="franja amarilla"></div>
        <div class="franja azul"></div>
        <div class="franja roja"></div>
    </div>

    <!-- Encabezado -->
    <div class="encabezado">
        <h2>Regístrate</h2>
        <p>En la mejor App de búsqueda tradicional.</p>
    </div>

    <!-- Contenido -->
    <div class="register-layout">
        <!-- Formulario -->
        <form method="POST" action="/register" class="register-form">
            <div class="input-group">
                <label for="first_name">Nombre</label>
                <input type="text" id="first_name" name="first_name" required>
            </div>
            <div class="input-group">
                <label for="last_name">Apellido</label>
                <input type="text" id="last_name" name="last_name" required>
            </div>
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="input-group">
                <label for="phone">Teléfono</label>
                <input type="text" id="phone" name="phone" required>
            </div>
            <div class="input-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="input-group">
                <label for="confirm_password">Confirmar Contraseña</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <button type="submit" class="btn">Registrarse</button>
        </form>

        <!-- Imagen lateral -->
        <img src="{{ url_for('static', filename='bandera.png') }}" alt="Imagen de registro" class="imagen-registro">

    </div>
</body>
</html>
