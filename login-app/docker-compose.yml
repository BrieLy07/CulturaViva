services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    restart: always

  web:
    build: ./app
    ports:
      - "5000:5000"
    env_file:
      - .env 
    restart: always



volumes:
  mysql_data:
 #hf_cache:  

